[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600
upload_resetmethod = ck

; ESP32-S3 native USB CDC/JTAG (built-in USB serial)
upload_protocol = esp-builtin

lib_deps =
    lvgl/lvgl@^9.2.0
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_CS=10
    -D TFT_DC=6
    -D TFT_RST=7
    -D TFT_MOSI=11
    -D TFT_MISO=13
    -D TFT_SCLK=12
    -D TFT_BL=1
    -D CST816S_SDA=4
    -D CST816S_SCL=5
    -D CST816S_RST=3
    -D CST816S_INT=0
    -D DOOR_RELAY=21
    -D BUZZER_PIN=18
    -I .
