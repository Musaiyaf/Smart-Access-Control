[platformio]
src_dir = .

[env:BOARD_VIEWE_UEDX24320028E_WB_A]
; pioarduino fork is required for the Arduino-ESP32 3.1.1 core that
; ESP32_Display_Panel targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
board = BOARD_VIEWE_UEDX24320028E_WB_A
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Official VIEWE display/touch stack: the real hardware uses a GC9307
; display driver and a CHSC6540 touch controller (not the ILI9341/CST816S
; this project previously assumed), on entirely different GPIO pins. Rather
; than hand-port register sequences for those chips, this uses VIEWE's own
; validated ESP32_Display_Panel-based board profile, which wires up the
; correct driver, pins and LVGL port for the exact UEDX24320028E-WB-A panel.
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D ESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -D BOARD_VIEWE_UEDX24320028E_WB_A
    -D LV_COLOR_16_SWAP=1
    -D DOOR_RELAY=21
    -D BUZZER_PIN=18
    -I .
